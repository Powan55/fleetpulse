server.port: ${SERVER_PORT:8080}
spring:
  application.name: processor
  kafka:
    listener:
      type: batch
      ack-mode: batch
      concurrency: ${FP_CONSUMER_CONCURRENCY:3}
    consumer:
      group-id: ${FP_GROUP_ID:fleetpulse-processor}
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: ${FP_MAX_POLL_RECORDS:500}
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    group.readiness.include: readinessState,db
  opentelemetry.resource-attributes:
    service.instance.id: ${HOSTNAME:local}
server.error.include-stacktrace: never
fp:
  topic: ${FP_TOPIC:fleetpulse.telemetry.v1}
  dlq-topic: ${FP_DLQ_TOPIC:fleetpulse.telemetry.v1.dlq}
  notify-channel: ${FP_NOTIFY_CHANNEL:fleetpulse_changes}
  retention:
    inbox: ${FP_RETENTION_INBOX:30m}
    telemetry: ${FP_RETENTION_TELEMETRY:15m}
    late: ${FP_RETENTION_LATE:1h}
    history: ${FP_RETENTION_HISTORY:7d}
    alerts: ${FP_RETENTION_ALERTS:7d}
    outbox-delivered: ${FP_RETENTION_OUTBOX_DELIVERED:24h}
    interval: ${FP_RETENTION_INTERVAL:60s}
  rules-file: ${FP_RULES_FILE:}
  sweep:
    offline-timeout: ${FP_OFFLINE_TIMEOUT:10s}
    interval: ${FP_SWEEP_INTERVAL:1s}
    max-lag: ${FP_SWEEP_MAX_LAG:1000}
    grace: ${FP_SWEEP_GRACE:10s}
  test-hooks:
    enabled: ${FP_TEST_HOOKS_ENABLED:false}
    auto-resume: 300s
  webhook:
    sink-url: ${FP_SINK_URL:http://sink:8080/webhooks/alerts}
    timeout: ${FP_WEBHOOK_TIMEOUT:5s}
    max-attempts: ${FP_WEBHOOK_MAX_ATTEMPTS:20}
    backoff-base: ${FP_WEBHOOK_BACKOFF_BASE:1s}
    backoff-max: ${FP_WEBHOOK_BACKOFF_MAX:30s}
    jitter: ${FP_WEBHOOK_JITTER:0.2}
    concurrency: ${FP_WEBHOOK_CONCURRENCY:10}
    poll-interval: ${FP_OUTBOX_POLL_INTERVAL:250ms}
