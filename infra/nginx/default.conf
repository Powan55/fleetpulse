# Anything that doesn't carry a known Host gets no reply (DNS-rebinding guard).
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1 web;

    root /usr/share/nginx/html;
    client_max_body_size 16k;

    # re-resolve upstreams so api/simulator restarts with a new IP are picked up
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/stream {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /sim/api/v1/ {
        set $sim http://simulator:8080;
        rewrite ^/sim(/api/v1/.*)$ $1 break;
        proxy_pass $sim;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
